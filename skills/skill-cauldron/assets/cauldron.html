<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500&display=swap">
<style>
.cx{--cx-t:var(--text-primary,#1f1e1d);--cx-s:var(--text-secondary,#5f5e5a);--cx-warn:var(--text-warning,#854F0B);--cx-err:var(--text-danger,#A32D2D);--cx-disp:"Alegreya",var(--font-voice,Georgia),serif;font-family:var(--font-sans,system-ui,-apple-system,"Segoe UI",sans-serif);color:var(--cx-t);max-width:520px;margin:0 auto;padding:.5rem 0}
@media (prefers-color-scheme:dark){.cx-standalone .cx{--cx-t:#f1efe8;--cx-s:#b4b2a9;--cx-warn:#FAC775;--cx-err:#F09595}}
.cx-standalone body{background:#faf9f5;margin:0;padding:16px}
@media (prefers-color-scheme:dark){.cx-standalone body{background:#1f1e1d}}
.cx .scene{border-radius:16px;overflow:hidden;background:#0e1a1c;line-height:0}
.cx .shelf{background:#f1e4c3;border:1px solid #c9a96b;border-radius:16px;padding:12px 12px 6px;margin-top:10px;color:#3b2a1a}
.cx .lb{font-size:13px;color:#5d4528;margin:4px 2px 8px;display:flex;align-items:center;gap:6px}
.cx .ch{display:inline-flex;align-items:center;gap:8px;margin:0 6px 8px 0;padding:4px 12px 4px 4px;min-height:36px;font:inherit;font-size:13px;color:#3b2a1a;background:#f6ead0;border:1px solid #c9a96b;border-radius:999px;cursor:pointer}
.cx .ch:hover{background:#fbf2df}
.cx .ch[aria-pressed="true"]{background:#fde3c4;border-color:#b64e1c;box-shadow:0 0 0 1px #b64e1c}
.cx .ic{width:28px;height:28px;border-radius:50%;background:#e9d7ac;display:inline-flex;align-items:center;justify-content:center;flex:none}
.cx .meta{color:#6b5233;font-size:12px}
.cx .act{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.cx .act button{font:inherit;font-size:13px;min-height:36px;padding:6px 12px;border-radius:999px;cursor:pointer}
.cx .fl{transform-box:fill-box;transform-origin:50% 100%;animation:cxf .8s ease-in-out infinite alternate}
.cx .stm{animation:cxs 3.2s ease-in-out infinite}.cx .tw{animation:cxt 1.6s ease-in-out infinite alternate}
@keyframes cxf{from{transform:scale(1,1)}to{transform:scale(.88,.78)}}
@keyframes cxs{0%{transform:translateY(6px);opacity:0}40%{opacity:.5}100%{transform:translateY(-16px);opacity:0}}
@keyframes cxt{from{opacity:.25}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.cx .fl,.cx .stm,.cx .tw{animation:none}}
.cx .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
<div class="cx">
<h2 class="sr">Skill cauldron: tap ingredients to drop them into the pot, then brew a new skill</h2>
<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 2px 8px">

<span style="display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--cx-s);white-space:nowrap"><span id="cx-slots" style="display:inline-flex;gap:4px"></span><span id="cx-ct"></span></span>
</div>
<div class="scene">

<g id="cx-glow" fill="#5f55d6" opacity="0" style="transition:fill .6s,opacity .6s"><circle cx="190" cy="120" r="88" opacity=".55"/><circle cx="190" cy="120" r="62"/></g>
<g id="cx-spk" fill="#f2c14e" opacity="0" style="transition:opacity .5s"><path class="tw" d="M96 96 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z"/><path class="tw" style="animation-delay:.5s" d="M286 86 l2.4 5.6 5.6 2.4 -5.6 2.4 -2.4 5.6 -2.4 -5.6 -5.6 -2.4 5.6 -2.4z"/><path class="tw" style="animation-delay:.9s" d="M300 150 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z"/></g>

<path class="fl" style="animation-delay:.25s" d="M180 212 C170 190 184 176 190 160 C196 178 210 192 200 212 Z" fill="#ffb02e"/>
<path class="fl" style="animation-delay:.5s" d="M200 212 C194 198 202 186 208 176 C212 190 222 198 214 212 Z" fill="#f07a1f"/>
<ellipse cx="128" cy="216" rx="15" ry="8" fill="#4a4a46"/><ellipse cx="252" cy="216" rx="15" ry="8" fill="#4a4a46"/><ellipse cx="148" cy="224" rx="12" ry="6" fill="#3d3d3a"/><ellipse cx="232" cy="224" rx="12" ry="6" fill="#3d3d3a"/>
<path d="M120 124 C104 124 100 142 116 146" fill="none" stroke="#2b2f36" stroke-width="6" stroke-linecap="round"/><path d="M260 124 C276 124 280 142 264 146" fill="none" stroke="#2b2f36" stroke-width="6" stroke-linecap="round"/>
<path d="M114 118 C114 176 148 204 190 204 C232 204 266 176 266 118 Z" fill="#2b2f36"/>
<path d="M132 134 C134 166 150 184 168 192" fill="none" stroke="#454b55" stroke-width="5" stroke-linecap="round"/>
<ellipse cx="190" cy="118" rx="80" ry="14" fill="#3a3f47"/>
<ellipse id="cx-liq" cx="190" cy="119" rx="69" ry="9.5" style="fill:#8fa3a0;transition:fill .6s"/>
<g id="cx-steam" fill="none" stroke="#d9c9a3" stroke-width="3" stroke-linecap="round" style="transition:stroke .6s"><path class="stm" d="M168 100 C162 88 174 80 168 66"/><path class="stm" style="animation-delay:1.1s" d="M196 98 C190 86 202 78 196 62"/><path class="stm" style="animation-delay:2.2s" d="M220 100 C214 88 226 80 220 68"/></g>
<g id="cx-fx"></g>
</svg>
</div>
<p id="cx-hint" style="font-size:13px;color:var(--cx-s);margin:8px 2px 0;line-height:1.5">Tap ingredients to drop them in.</p>
<p id="cx-note" style="font-size:13px;color:var(--cx-s);margin:2px 2px 0;min-height:20px;line-height:1.5"></p>
<div class="shelf" id="cx-rows"></div>
<div class="act">
<button id="cx-brew" style="background:#b64e1c;color:#fff6ea;border:1px solid #b64e1c">Brew this skill ↗</button>
<button id="cx-more" style="background:#f6ead0;color:#3b2a1a;border:1px solid #c9a96b">More from skills.sh ↗</button>
<button id="cx-clr" style="background:transparent;color:var(--cx-t);border:.5px solid var(--border-strong,rgba(31,30,29,.28))" aria-label="Empty the cauldron">Empty</button>
</div>
<p id="cx-msg" role="status" style="font-size:13px;margin:8px 2px 0;min-height:18px;line-height:1.5"></p>
</div>
<script type="application/json" id="cx-data">__DATA__</script>
<script>
(function(){
var D;try{D=JSON.parse(document.getElementById('cx-data').textContent)}catch(e){D={rows:[]}}
var PAL={teal:'#3fc7a4',purple:'#9b7cf0',coral:'#ff7a59',amber:'#f2c14e',blue:'#5aa9e6',pink:'#e86a9a',green:'#7cc35a',gray:'#a39e8f'};
var KIND={teal:'herb',purple:'crystal',coral:'mushroom'};
function col(c){return PAL[c]||(/^#[0-9a-f]{6}$/i.test(c||'')?c:'#a39e8f')}
var MAX=D.maxRecommended||3,CAP=D.cap||5,live=typeof sendPrompt==='function';
if(!live)document.documentElement.classList.add('cx-standalone');
var NS='http://www.w3.org/2000/svg',$=function(i){return document.getElementById(i)};
var liq=$('cx-liq'),fx=$('cx-fx'),msg=$('cx-msg'),note=$('cx-note'),glow=$('cx-glow');
var rm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var picks=[],btns={};
function imp(e,o){for(var k in o)e.style.setProperty(k,o[k],'important')}
var BT={'font-family':'inherit','font-size':'13px','font-weight':'400','line-height':'1.2','min-height':'36px',height:'auto','border-radius':'999px',cursor:'pointer','box-shadow':'none'};
function paint(b,on){imp(b,BT);imp(b,{display:'inline-flex','align-items':'center',gap:'8px',margin:'0 6px 8px 0',padding:'4px 12px 4px 4px',color:'#3b2a1a',background:on?'#fde3c4':'#f6ead0',border:'1px solid '+(on?'#b64e1c':'#c9a96b'),'box-shadow':on?'0 0 0 1px #b64e1c':'none'})}
var GL={herb:'<path d="M12 21V10" stroke="#1f6b55" stroke-width="2" stroke-linecap="round"/><path d="M12 14C8 13 5.5 10 5.5 6.5 9 6.5 12 9 12 14Z" fill="#3fc7a4"/><path d="M12 11.5C16 10.5 18.5 7.5 18.5 4 15 4 12 6.5 12 11.5Z" fill="#2fae8c"/>',
crystal:'<path d="M12 2.5 19 9.5 12 21.5 5 9.5Z" fill="#9b7cf0"/><path d="M12 2.5 15 9.5 12 21.5 9 9.5Z" fill="#b9a2f7"/><path d="M5 9.5H19" stroke="#6a4fc7" stroke-width="1"/>',
mushroom:'<rect x="9" y="11" width="6" height="9" rx="2.5" fill="#f6ead0" stroke="#c9a96b"/><path d="M3 12.5C3 6.5 7 3 12 3S21 6.5 21 12.5Z" fill="#ff7a59"/><circle cx="8" cy="8.5" r="1.6" fill="#fff1e6"/><circle cx="13.5" cy="6.2" r="1.3" fill="#fff1e6"/><circle cx="16.5" cy="9.6" r="1.2" fill="#fff1e6"/>'};
function glyph(c,kind,size){var s=document.createElementNS(NS,'svg');s.setAttribute('viewBox','0 0 24 24');s.setAttribute('width',size);s.setAttribute('height',size);s.setAttribute('aria-hidden','true');
s.innerHTML=GL[kind]||'<path d="M9.5 3h5v5.5c3 1.2 5 3.9 5 7A7.5 7.5 0 0 1 4.5 15.5c0-3.1 2-5.8 5-7Z" fill="'+c+'"/><rect x="9" y="2" width="6" height="2.5" rx="1" fill="#b98a5e"/>';return s}
function say(t,kind){msg.textContent=t;msg.style.color=kind==='err'?'var(--cx-err)':'var(--cx-s)'}
function hue(h){var r=parseInt(h.slice(1,3),16)/255,g=parseInt(h.slice(3,5),16)/255,b=parseInt(h.slice(5,7),16)/255,mx=Math.max(r,g,b),d=mx-Math.min(r,g,b),u=0;if(d){u=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;u*=60;if(u<0)u+=360}return u}
function mix(){if(!picks.length)return'#8fa3a0';if(picks.length>MAX)return'#6f6347';var x=0,y=0;picks.forEach(function(p){var a=hue(p.c)*Math.PI/180;x+=Math.cos(a);y+=Math.sin(a)});
if(Math.sqrt(x*x+y*y)/picks.length<.12)return picks[picks.length-1].c;var a=Math.atan2(y,x)*180/Math.PI;if(a<0)a+=360;return'hsl('+Math.round(a)+',62%,58%)'}
function ui(){var n=picks.length,m=mix(),murky=n>MAX;$('cx-ct').textContent=n+' of '+MAX;
var sl=$('cx-slots');sl.textContent='';for(var i=0;i<Math.max(MAX,n);i++){var d=document.createElement('span');d.style.cssText='width:10px;height:10px;border-radius:50%;display:inline-block;box-sizing:border-box;border:1px solid '+(i>=MAX?'#b64e1c':'#c9a96b')+';background:'+(i<n?(murky?'#6f6347':picks[i].c):'transparent');sl.appendChild(d)}
$('cx-nm').textContent=n?picks.map(function(p){return p.n}).join(' + '):(D.title||'Empty cauldron');
var h=$('cx-hint');h.style.color=murky?'var(--cx-warn)':'var(--cx-s)';
h.textContent=n===0?(D.goal?'Goal: '+D.goal+'. Tap ingredients to drop them in.':'Tap ingredients to drop them in.'):murky?'Turning murky. Past '+MAX+', skills help far less.':n===MAX?'Balanced. Ready to brew.':'Add more, or brew now.';
liq.style.fill=m;glow.style.fill=murky?'#6f6347':m;glow.style.opacity=n?(murky?.1:.2):0;$('cx-spk').style.opacity=n===MAX?1:0;$('cx-steam').style.stroke=murky?'#7d7462':'#d9c9a3'}
function ripple(c,x){if(!fx.animate)return;var r=document.createElementNS(NS,'ellipse');r.setAttribute('cx',x);r.setAttribute('cy',119);r.setAttribute('rx',26);r.setAttribute('ry',4);r.setAttribute('fill','none');r.setAttribute('stroke',c);r.setAttribute('stroke-width',2);r.style.transformBox='fill-box';r.style.transformOrigin='center';fx.appendChild(r);
r.animate([{transform:'scale(.2)',opacity:1},{transform:'scale(1.7)',opacity:0}],{duration:650,easing:'ease-out'}).onfinish=function(){r.remove()}}
function drop(p){if(rm||!fx.animate){ui();return}var x=Math.round(190+Math.random()*60-30),sx=x+(Math.random()<.5?-70:70),g=document.createElementNS(NS,'g');
var t=document.createElementNS(NS,'circle');t.setAttribute('r',13);t.setAttribute('fill','#f6ead0');t.setAttribute('stroke','#c9a96b');t.setAttribute('stroke-width',1.5);g.appendChild(t);
var gl=glyph(p.c,p.k,18);gl.setAttribute('x',-9);gl.setAttribute('y',-9);g.appendChild(gl);fx.appendChild(g);
g.animate([{transform:'translate('+sx+'px,30px) scale(.6)',opacity:0},{transform:'translate('+((sx+x)/2)+'px,4px) scale(1)',opacity:1,offset:.45},{transform:'translate('+x+'px,116px) scale(.5)',opacity:1}],{duration:700,easing:'cubic-bezier(.4,0,.8,1)',fill:'forwards'}).onfinish=function(){g.remove();ripple(p.c,x);ui()}}
setInterval(function(){if(rm||!picks.length||!fx.animate)return;var b=document.createElementNS(NS,'circle');b.setAttribute('cx',Math.round(146+Math.random()*88));b.setAttribute('cy',117);b.setAttribute('r',Math.round(2+Math.random()*4));b.setAttribute('fill',mix());fx.appendChild(b);
b.animate([{transform:'translateY(0)',opacity:.9},{transform:'translateY(-'+Math.round(30+Math.random()*30)+'px)',opacity:0}],{duration:1500,easing:'ease-out'}).onfinish=function(){b.remove()}},380);
function toggle(it,c,k,b,animate){say('');var i=-1;picks.forEach(function(p,j){if(p.n===it.name)i=j});
if(i>-1){picks.splice(i,1);b.setAttribute('aria-pressed','false');paint(b,false);note.textContent='';ui();return}
if(picks.length>=CAP){say('The cauldron is full. Take one out first.','err');return}
var p={n:it.name,c:c,k:k,row:it._row};picks.push(p);b.setAttribute('aria-pressed','true');paint(b,true);note.textContent=it.note?it.name+': '+it.note:'';
if(animate)drop(p);else ui()}
var rows=$('cx-rows');
(D.rows||[]).forEach(function(r){var c=col(r.color),k=KIND[r.color]||'',lb=document.createElement('div');lb.className='lb';lb.appendChild(glyph(c,k,16));lb.appendChild(document.createTextNode(r.label||''));rows.appendChild(lb);
var wrap=document.createElement('div');(r.items||[]).forEach(function(it){it._row=r.label;var b=document.createElement('button');b.className='ch';b.setAttribute('aria-pressed','false');paint(b,false);var ic=document.createElement('span');ic.className='ic';ic.appendChild(glyph(c,k,20));b.appendChild(ic);b.appendChild(document.createTextNode(it.name));
if(it.meta){var m=document.createElement('span');m.className='meta';m.textContent=it.meta;b.appendChild(m)}
if(it.note)b.title=it.note;b.addEventListener('click',function(){toggle(it,c,k,b,true)});btns[it.name]={b:b,it:it,c:c,k:k};wrap.appendChild(b)});rows.appendChild(wrap)});
if(!(D.rows||[]).length)rows.style.display='none';
(D.preselected||[]).forEach(function(n){var x=btns[n];if(x)toggle(x.it,x.c,x.k,x.b,false)});
function send(t){if(live){sendPrompt(t);return}
var done=function(){say('Copied. Paste it into your chat with Claude.')},fail=function(){say('Paste this into your chat with Claude: '+t)};
try{navigator.clipboard.writeText(t).then(done,fail)}catch(e){fail()}}
function list(){return picks.map(function(p){return p.n+' ('+p.row+')'}).join(', ')}
$('cx-brew').addEventListener('click',function(){if(!picks.length){say('Add at least one ingredient first.','err');return}send('Brew a skill from these ingredients: '+list()+'.'+(D.goal?' Goal: '+D.goal+'.':''))});
$('cx-more').addEventListener('click',function(){send(picks.length?'Find more skills.sh ingredients that pair with: '+list()+'.':'Find more skills.sh ingredients that fit my habits.')});
$('cx-clr').addEventListener('click',function(){picks.length=0;note.textContent='';say('');Object.keys(btns).forEach(function(k){btns[k].b.setAttribute('aria-pressed','false');paint(btns[k].b,false)});ui()});
imp($('cx-brew'),BT);imp($('cx-brew'),{padding:'6px 14px',background:'#b64e1c',color:'#fff6ea',border:'1px solid #b64e1c'});
imp($('cx-more'),BT);imp($('cx-more'),{padding:'6px 14px',background:'#f6ead0',color:'#3b2a1a',border:'1px solid #c9a96b'});
ui();
})();
</script>
