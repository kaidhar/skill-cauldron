<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500&display=swap">
<style>
.rc-standalone body{background:#faf9f5;margin:0;padding:24px 16px}
@media (prefers-color-scheme:dark){.rc-standalone body{background:#1f1e1d}}
.rc{--rc-disp:"Alegreya",var(--font-voice,Georgia),serif;max-width:360px;margin:0 auto;background:#0e1a1c;color:#f6ead0;border-radius:20px;padding:16px 16px 14px;font-family:var(--font-sans,system-ui,-apple-system,"Segoe UI",sans-serif);box-sizing:border-box;overflow:hidden}
.rc .top{display:flex;justify-content:space-between;font-size:12px;color:#d9c9a3}
.rc .hd{font-family:var(--rc-disp);font-size:26px;font-weight:500;color:#f2c14e;text-align:center;margin:6px 0 0;line-height:1.2}
.rc .card{position:relative;background:#f6ead0;border:2px solid #c9a96b;border-radius:16px;padding:16px 16px 14px;color:#3b2a1a;margin-top:-6px;animation:rci .6s ease-out .15s both}
.rc .lbl{font-size:12px;letter-spacing:.08em;color:#6b5233}
.rc h3{font-family:var(--rc-disp);font-size:24px;font-weight:500;line-height:1.2;margin:4px 0 6px;color:#3b2a1a;padding-right:64px}
.rc .job{font-size:14px;line-height:1.5;color:#5d4528;margin:0 0 10px}
.rc .sec{font-size:12px;color:#6b5233;margin:12px 0 2px}
.rc .row{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500;padding:7px 0;border-top:1px solid #e3cf9f}
.rc .src{margin-left:auto;font-size:12px;font-weight:400;color:#6b5233;white-space:nowrap}
.rc .chip{display:inline-block;font-size:12px;padding:4px 10px;border-radius:999px;background:#ead9b0;color:#3b2a1a;margin:4px 6px 2px 0}
.rc .res{display:inline-block;font-size:12px;padding:5px 10px;border-radius:999px;margin-top:10px}
.rc .code{font-family:var(--font-mono,ui-monospace,Menlo,monospace);font-size:11px;background:#ead9b0;color:#3b2a1a;border-radius:8px;padding:8px 10px;margin-top:10px;word-break:break-all;line-height:1.5}
.rc .seal{position:absolute;right:-10px;top:-22px;width:92px;height:92px;transform:rotate(-12deg);animation:rcs .45s cubic-bezier(.3,1.6,.5,1) .85s both}
.rc .seal span{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff1e6;text-align:center;line-height:1.05}
.rc .foot{font-size:12px;color:#d9c9a3;margin-top:12px;text-align:center}
.rc .rays{transform-box:view-box;transform-origin:180px 112px;animation:rcr 40s linear infinite}
.rc .bob{animation:rcb 2.8s ease-in-out infinite alternate}.rc .bub{animation:rcu 2.4s ease-in infinite}.rc .tw{animation:rct 1.6s ease-in-out infinite alternate}
@keyframes rci{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes rcs{from{transform:rotate(-12deg) scale(2.2);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:1}}
@keyframes rcr{to{transform:rotate(360deg)}}
@keyframes rcb{from{transform:translateY(0)}to{transform:translateY(-6px)}}
@keyframes rcu{from{transform:translateY(0);opacity:.8}to{transform:translateY(-30px);opacity:0}}
@keyframes rct{from{opacity:.3}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.rc .card,.rc .seal,.rc .rays,.rc .bob,.rc .bub,.rc .tw{animation:none}}
.rc .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
<div class="rc" id="rc">
<h2 class="sr" id="rc-sr">Skill recipe card</h2>
<div class="top"><span id="rc-kind">Skill cauldron</span><span id="rc-by"></span></div>
<p class="hd" id="rc-hd">New skill brewed!</p>
<svg viewBox="0 0 360 200" width="100%" style="display:block" role="img" aria-label="A glowing potion flask"><defs><clipPath id="rc-clip"><path d="M168 46 V78 C142 86 128 106 128 130 C128 158 151 178 180 178 C209 178 232 158 232 130 C232 106 218 86 192 78 V46 Z"/></clipPath></defs>
<g class="rays" fill="#f2c14e" opacity=".09"><path d="M180 112 L150 -120 L210 -120 Z"/><path d="M180 112 L150 -120 L210 -120 Z" transform="rotate(45 180 112)"/><path d="M180 112 L150 -120 L210 -120 Z" transform="rotate(90 180 112)"/><path d="M180 112 L150 -120 L210 -120 Z" transform="rotate(135 180 112)"/><path d="M180 112 L150 -120 L210 -120 Z" transform="rotate(180 180 112)"/><path d="M180 112 L150 -120 L210 -120 Z" transform="rotate(225 180 112)"/><path d="M180 112 L150 -120 L210 -120 Z" transform="rotate(270 180 112)"/><path d="M180 112 L150 -120 L210 -120 Z" transform="rotate(315 180 112)"/></g>
<circle id="rc-g1" cx="180" cy="122" r="92" fill="#5f55d6" opacity=".14"/><circle id="rc-g2" cx="180" cy="124" r="62" fill="#5f55d6" opacity=".2"/>
<g fill="#f2c14e"><path class="tw" d="M74 70 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z"/><path class="tw" style="animation-delay:.6s" d="M286 56 l2.4 5.6 5.6 2.4 -5.6 2.4 -2.4 5.6 -2.4 -5.6 -5.6 -2.4 5.6 -2.4z"/><path class="tw" style="animation-delay:1s" d="M296 146 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z"/><path class="tw" style="animation-delay:.3s" d="M60 150 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z"/></g>
<g class="bob">
<g clip-path="url(#rc-clip)"><rect x="120" y="0" width="120" height="200" fill="#f6ead0" opacity=".12"/><rect id="rc-liq" x="120" y="106" width="120" height="80" fill="#5f55d6"/><ellipse id="rc-top" cx="180" cy="106" rx="56" ry="6" fill="#8f88ff"/>
<circle class="bub" cx="164" cy="160" r="4" fill="#f6ead0" opacity=".6"/><circle class="bub" style="animation-delay:.8s" cx="190" cy="166" r="3" fill="#f6ead0" opacity=".6"/><circle class="bub" style="animation-delay:1.6s" cx="204" cy="152" r="2.5" fill="#f6ead0" opacity=".6"/></g>
<path d="M168 46 V78 C142 86 128 106 128 130 C128 158 151 178 180 178 C209 178 232 158 232 130 C232 106 218 86 192 78 V46 Z" fill="none" stroke="#f6ead0" stroke-width="3"/>
<path d="M146 120 C142 136 148 152 158 160" fill="none" stroke="#f6ead0" stroke-width="3" stroke-linecap="round" opacity=".5"/>
<rect x="163" y="30" width="34" height="18" rx="4" fill="#b98a5e"/><rect x="163" y="42" width="34" height="5" fill="#8f6640"/>
</g>
</svg>
<div class="card">
<div class="seal" id="rc-seal" aria-hidden="true"><svg viewBox="0 0 92 92" width="92" height="92"><g id="rc-wax" fill="#9e2b25"><circle cx="46" cy="46" r="38"/><circle cx="16" cy="30" r="7"/><circle cx="80" cy="58" r="6"/><circle cx="58" cy="86" r="5"/><circle cx="30" cy="10" r="5"/></g><circle cx="46" cy="46" r="29" fill="none" stroke="#fff1e6" stroke-opacity=".35" stroke-width="2"/></svg><span><b id="rc-s1" style="font-family:var(--rc-disp);font-size:19px;font-weight:500">Tested</b><small id="rc-s2" style="font-size:11px;font-weight:500">by you</small></span></div>
<div class="lbl" id="rc-lbl">New skill</div>
<h3 id="rc-title"></h3>
<p class="job" id="rc-job"></p>
<div id="rc-body"></div>
</div>
<div class="foot" id="rc-foot"></div>
</div>
<script type="application/json" id="rc-data">__DATA__</script>
<script>
(function(){
var D;try{D=JSON.parse(document.getElementById('rc-data').textContent)}catch(e){D={}}
if(typeof sendPrompt!=='function')document.documentElement.classList.add('rc-standalone');
var PAL={teal:'#3fc7a4',purple:'#9b7cf0',coral:'#ff7a59',amber:'#f2c14e',blue:'#5aa9e6',pink:'#e86a9a',green:'#7cc35a',gray:'#a39e8f'};
var KIND={teal:'herb',purple:'crystal',coral:'mushroom'};
function col(c){return PAL[c]||(/^#[0-9a-f]{6}$/i.test(c||'')?c:'#a39e8f')}
var NS='http://www.w3.org/2000/svg',$=function(i){return document.getElementById(i)};
var GL={herb:'<path d="M12 21V10" stroke="#1f6b55" stroke-width="2" stroke-linecap="round"/><path d="M12 14C8 13 5.5 10 5.5 6.5 9 6.5 12 9 12 14Z" fill="#3fc7a4"/><path d="M12 11.5C16 10.5 18.5 7.5 18.5 4 15 4 12 6.5 12 11.5Z" fill="#2fae8c"/>',
crystal:'<path d="M12 2.5 19 9.5 12 21.5 5 9.5Z" fill="#9b7cf0"/><path d="M12 2.5 15 9.5 12 21.5 9 9.5Z" fill="#b9a2f7"/><path d="M5 9.5H19" stroke="#6a4fc7" stroke-width="1"/>',
mushroom:'<rect x="9" y="11" width="6" height="9" rx="2.5" fill="#f6ead0" stroke="#c9a96b"/><path d="M3 12.5C3 6.5 7 3 12 3S21 6.5 21 12.5Z" fill="#ff7a59"/><circle cx="8" cy="8.5" r="1.6" fill="#fff1e6"/><circle cx="13.5" cy="6.2" r="1.3" fill="#fff1e6"/><circle cx="16.5" cy="9.6" r="1.2" fill="#fff1e6"/>'};
function glyph(color){var c=col(color),s=document.createElementNS(NS,'svg');s.setAttribute('viewBox','0 0 24 24');s.setAttribute('width',22);s.setAttribute('height',22);s.setAttribute('aria-hidden','true');s.style.flex='none';
s.innerHTML=GL[KIND[color]]||'<path d="M9.5 3h5v5.5c3 1.2 5 3.9 5 7A7.5 7.5 0 0 1 4.5 15.5c0-3.1 2-5.8 5-7Z" fill="'+c+'"/><rect x="9" y="2" width="6" height="2.5" rx="1" fill="#b98a5e"/>';return s}
function el(t,cls,txt){var e=document.createElement(t);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function hue(h){var r=parseInt(h.slice(1,3),16)/255,g=parseInt(h.slice(3,5),16)/255,b=parseInt(h.slice(5,7),16)/255,mx=Math.max(r,g,b),d=mx-Math.min(r,g,b),u=0;if(d){u=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;u*=60;if(u<0)u+=360}return u}
var dna=D.mode==='dna',body=$('rc-body');
$('rc-kind').textContent=dna?'Skill DNA':'Skill cauldron';
$('rc-by').textContent=D.brewer?(dna?D.brewer:'Brewed by '+D.brewer):'';
$('rc-hd').textContent=dna?'Your skill DNA':'New skill brewed!';
$('rc-lbl').textContent=dna?'Archetype':'New skill';
$('rc-title').textContent=dna?(D.archetype||'Your skill DNA'):(D.title||D.name||'Untitled potion');
$('rc-job').textContent=dna?(D.summary||''):(D.job||'');
$('rc-sr').textContent=(dna?'Skill DNA card: ':'Skill recipe card: ')+$('rc-title').textContent;
var mixList=dna?(D.suggested||[]):(D.ingredients||[]);
if(mixList.length){var x=0,y=0;mixList.forEach(function(i){var a=hue(col(i.color))*Math.PI/180;x+=Math.cos(a);y+=Math.sin(a)});
var h=null;if(Math.sqrt(x*x+y*y)/mixList.length>=.12){h=Math.atan2(y,x)*180/Math.PI;if(h<0)h+=360;h=Math.round(h)}
var fill=h===null?col(mixList[mixList.length-1].color):'hsl('+h+',58%,58%)',lite=h===null?fill:'hsl('+h+',80%,74%)';
$('rc-liq').setAttribute('fill',fill);$('rc-top').setAttribute('fill',lite);$('rc-g1').setAttribute('fill',fill);$('rc-g2').setAttribute('fill',fill)}
function rows(title,list){if(!list||!list.length)return;body.appendChild(el('div','sec',title));list.forEach(function(i){var r=el('div','row');r.appendChild(glyph(i.color));r.appendChild(el('span',null,i.name));if(i.source)r.appendChild(el('span','src',i.source));body.appendChild(r)})}
var seal=$('rc-seal');
if(dna){
seal.style.display='none';$('rc-title').style.paddingRight='0';
if(D.topTasks&&D.topTasks.length){body.appendChild(el('div','sec','Most common work'));var w=el('div');D.topTasks.forEach(function(t){w.appendChild(el('span','chip',t))});body.appendChild(w)}
rows('Habits',(D.habits||[]).map(function(h){return typeof h==='string'?{name:h,color:'teal'}:h}));
rows('Suggested ingredients',D.suggested);
$('rc-foot').textContent=D.footer||'Brew from this in the skill cauldron';
}else{
rows('Ingredients',D.ingredients);
var t=D.test||{status:'untested'},st=t.status||'untested';
var tone={won:['#dcebc4','#2f5a12','#9e2b25'],mixed:['#f6dfb0','#7a4a08','#a8661c'],lost:['#f3d0c4','#7a2a14','#6b5b4b']}[st];
if(tone){$('rc-wax').setAttribute('fill',tone[2])}else{seal.style.display='none';$('rc-title').style.paddingRight='0';tone=['#ead9b0','#5d4528']}
var p=el('span','res',t.label||(st==='untested'?'Not taste-tested yet':st));p.style.background=tone[0];p.style.color=tone[1];body.appendChild(p);
if(D.install)body.appendChild(el('div','code',D.install));
$('rc-foot').textContent=D.footer||'Brewed in the skill cauldron';
}
})();
</script>
